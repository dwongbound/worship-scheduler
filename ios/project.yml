# The Xcode project, as data.
#
#   brew install xcodegen && cd ios && xcodegen
#
# The generated TapWorship.xcodeproj is NOT committed — this file is the
# source of truth for it. An .xcodeproj is a directory of machine-written
# state that conflicts on every branch and whose diffs nobody can read; a spec
# that regenerates it in a second is the thing worth keeping in git.
# Re-run xcodegen after editing this file, or after adding a source folder.
name: TapWorship

options:
  bundleIdPrefix: com.tapworship
  deploymentTarget:
    iOS: "17.0"
  # Mirror the folders on disk in the navigator, rather than flattening them.
  createIntermediateGroups: true

packages:
  # The logic half of the app, as a local SwiftPM package. It builds and tests
  # WITHOUT Xcode (`swift run Checks` in that folder), which is what lets the
  # model and scheduling ports be verified on a machine that only has the
  # Command Line Tools installed.
  TapWorshipKit:
    path: TapWorshipKit

targets:
  TapWorship:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TapWorshipKit
        product: TapWorshipKit
    # Sign in with Apple. The capability also has to be ticked on this bundle
    # id in the Apple Developer portal (Identifiers), or signing fails.
    entitlements:
      path: App/TapWorship.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    # Debug only: where the API lives while developing (`./use-env dev`).
    configFiles:
      Debug: Config/Debug.xcconfig
    settings:
      configs:
        Debug:
          # Merged with the generated Info.plist. Carries the dev server's URL
          # and the one ATS allowance that lets the simulator reach
          # http://localhost. Release has neither.
          INFOPLIST_FILE: Config/Info-Debug.plist
      base:
        # Registered on the team below (2026-11-18). The bundle id is the
        # app's identity in App Store Connect and can never be reused.
        PRODUCT_BUNDLE_IDENTIFIER: com.tapworship.app
        # Dylan's Apple Developer Program team (Individual). Automatic signing
        # with this team registered com.tapworship.app with Sign in with Apple.
        DEVELOPMENT_TEAM: 7K9BY5Z7B7
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone and iPad. The web app already treats a tablet as a phone
        # (lib/layout.ts BOTTOM_NAV_MAX_WIDTH covers both), so shipping both
        # costs nothing in design decisions.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Swift 5 language mode. Bumping to 6.0 turns on strict concurrency
        # checking, which is worth doing deliberately rather than discovering
        # as a wall of errors on the first build.
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TapWorship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad multitasking needs every orientation, or App Store upload fails.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Only standard HTTPS: exempt from export paperwork, so TestFlight
        # doesn't ask on every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
