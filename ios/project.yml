# The Xcode project, as data.
#
#   brew install xcodegen && cd ios && xcodegen
#
# The generated TapWorship.xcodeproj is NOT committed — this file is the
# source of truth for it. An .xcodeproj is a directory of machine-written
# state that conflicts on every branch and whose diffs nobody can read; a spec
# that regenerates it in a second is the thing worth keeping in git.
# Re-run xcodegen after editing this file, or after adding a source folder.
name: TapWorship

options:
  bundleIdPrefix: com.tapworship
  deploymentTarget:
    iOS: "17.0"
  # Mirror the folders on disk in the navigator, rather than flattening them.
  createIntermediateGroups: true

packages:
  # The logic half of the app, as a local SwiftPM package. It builds and tests
  # WITHOUT Xcode (`swift run Checks` in that folder), which is what lets the
  # model and scheduling ports be verified on a machine that only has the
  # Command Line Tools installed.
  TapWorshipKit:
    path: TapWorshipKit

targets:
  TapWorship:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TapWorshipKit
        product: TapWorshipKit
    settings:
      base:
        # CHANGE THIS before you touch App Store Connect — the bundle id is
        # the app's identity there and can never be reused once registered.
        PRODUCT_BUNDLE_IDENTIFIER: com.tapworship.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone and iPad. The web app already treats a tablet as a phone
        # (lib/layout.ts BOTTOM_NAV_MAX_WIDTH covers both), so shipping both
        # costs nothing in design decisions.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Swift 5 language mode. Bumping to 6.0 turns on strict concurrency
        # checking, which is worth doing deliberately rather than discovering
        # as a wall of errors on the first build.
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TapWorship
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
